timeout = 20
max_retries = 2
retry_wait_time = 2

exclude = [
  # Workflow URLs become available after they reach the default branch.
  '^https://github\.com/jrmash/gh-star-repos/actions/workflows/',
  # Release Please adds comparisons before the new release tag exists.
  '^https://github\.com/jrmash/gh-star-repos/compare/v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?\.\.\.v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$',
]
