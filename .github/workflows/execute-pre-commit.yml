name: Execute pre-commit

on:
  pull_request:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/requirements-ci.txt
  PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/scripts/requirements-ci.txt
  VIRTUALENV_NO_PERIODIC_UPDATE: '1'

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup GoLang
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.14.2'
      - name: Install pre-commit
        run: python -m pip install --requirement scripts/requirements-ci.txt
      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-3.14.2-${{ hashFiles('.pre-commit-config.yaml', 'scripts/requirements-ci.txt') }}
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
