name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  cancel-in-progress: false
  group: release-${{ github.ref }}
permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Manage release PRs and draft releases
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: ${{ github.ref_name }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish Release
    needs: prepare
    if: needs.prepare.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Compile Extension
        uses: cli/gh-extension-precompile@1c8ed8f565dbeddb705dad995a4f75ceb815c0f9
        with:
          release_tag: ${{ needs.prepare.outputs.tag }}
          draft_release: true
          generate_attestations: true
          go_build_options: '-ldflags=-X=main.version=${{ needs.prepare.outputs.tag }}'
          go_version_file: go.mod
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --verify-tag --draft=false --latest
